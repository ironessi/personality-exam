# Copy this file to manifest/config/config.yaml before running the service.

server:
  address: "0.0.0.0:8000"
  graceful: true
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  name: "PersonalityTest"
  readTimeout: "60s"
  writeTimeout: "60s"
  idleTimeout: "60s"
  cors:
    AllowDomain:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
    AllowMethods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
    AllowHeaders: "Origin,Content-Type,Accept,Authorization,X-Requested-With,X-CSRF-Token"
    AllowCredentials: "true"
    MaxAge: 3600

logger:
  path: "logs"
  level: "all"
  stdout: true
  stderr: true

system:
  errorStack: true
  errorLog: true

database:
  default:
    link: "mysql:YOUR_DATABASE_USER:YOUR_DATABASE_PASSWORD@tcp(127.0.0.1:3306)/YOUR_DATABASE_NAME?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai"

redis:
  default:
    address: "127.0.0.1:6379"
    db: 0
    pass: "YOUR_REDIS_PASSWORD"

sms:
  accessKeyId: "YOUR_ALIYUN_ACCESS_KEY_ID"
  accessKeySecret: "YOUR_ALIYUN_ACCESS_KEY_SECRET"
  endpoint: "dypnsapi.aliyuncs.com"
  signName: "YOUR_SMS_SIGN_NAME"
  templateCode: "YOUR_SMS_TEMPLATE_CODE"

# RAG 增强（旁路；关掉不影响测评本身）。详见 doc/RAG增强系统开发文档.md §6.1
rag:
  enable:         false          # 总开关；没有显式打开绝不外呼
  baseUrl:        "http://127.0.0.1:8001"
  apiKey:         ""             # 对外暴露 rag-service 时必填
  syncDeadlineSeconds: 3         # 同步尝试的硬期限（仅 syncOnMiss=true 时生效）
  syncOnMiss:     false          # 缓存未命中就直接入队：实测 3 秒期限必然到期，
                                 # 同步尝试只会额外付一次 token
  timeoutSeconds: 30             # 只作用于后台 worker 的 HTTP 调用
  maxSuggestions: 5
  testTypes:      [13, 1]        # 灰度白名单（MBTI=13、SCL-90=1）
  queueKey:       "rag:queue"
  cacheTTL:       2592000        # 30 天
  redis:                         # 独立 db，与业务缓存隔离
    address: "127.0.0.1:6379"
    db:      5
    pass:    ""
