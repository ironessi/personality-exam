# Copy this file to hack/config.yaml when using gfcli code generation.

gfcli:
  gen:
    dao:
      - type: "mysql"
        host: "127.0.0.1"
        port: 3306
        user: "YOUR_DATABASE_USER"
        pass: "YOUR_DATABASE_PASSWORD"
        name: "YOUR_DATABASE_NAME"
        charset: "utf8mb4"
        descriptionTag: true

  docker:
    build: "-a amd64 -s linux -p temp -ew"
    tagPrefixes:
      - "your-registry.example.com/personality-test"
